name: Build Flutter APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch blue_thermal_printer namespace and compileSdk
        run: |
          for f in $(find /home/runner/.pub-cache/hosted/pub.dev/blue_thermal_printer-*/android -name build.gradle 2>/dev/null); do
            if ! grep -q 'namespace "id.kakzaki.blue_thermal_printer"' "$f"; then
              sed -i '/android {/a \    namespace "id.kakzaki.blue_thermal_printer"' "$f"
            fi
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$f"
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$f"
          done

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Love Kush POS - APK Download (v1.0.${{ github.run_number }})"
          body: "Download the `app-release.apk` file below to install on your Android device."
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

